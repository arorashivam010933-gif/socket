<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Simple Chat Test</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    #messages { border: 1px solid #ccc; height: 250px; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
    .msg { margin: 4px 0; }
    .meta { font-size: 12px; color: #555; }
  </style>
</head>
<body>
  <h2>Simple Chat (Socket.IO)</h2>

  <div>
    <label>Username: </label>
    <input id="username" placeholder="alice or bob" />
    <button id="loginBtn">Login</button>
  </div>

  <div id="chatBox" style="display:none; margin-top: 15px;">
    <div id="messages"></div>
    <input id="messageInput" placeholder="Type a message..." style="width: 70%;" />
    <button id="sendBtn">Send</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4/dist/socket.io.min.js"></script>
  <script>
    const API_BASE = 'http://localhost:4000';
    let socket;
    let userId = null;

    const usernameInput = document.getElementById('username');
    const loginBtn = document.getElementById('loginBtn');
    const chatBox = document.getElementById('chatBox');
    const messagesDiv = document.getElementById('messages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    loginBtn.onclick = async () => {
      const username = usernameInput.value.trim();
      if (!username) return alert('Enter a username');

      const res = await fetch(`${API_BASE}/users`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username })
      });

      const user = await res.json();
      userId = user._id;

      // Connect socket
      socket = io('http://localhost:4000');

      socket.on('connect', () => {
        console.log('socket connected');
        chatBox.style.display = 'block';
        loadMessages();
      });

      socket.on('new_message', (msg) => {
        appendMessage(msg);
      });

      socket.on('disconnect', () => {
        console.log('socket disconnected');
      });
    };

    async function loadMessages() {
      const res = await fetch(`${API_BASE}/messages`);
      const messages = await res.json();
      messagesDiv.innerHTML = '';
      messages.forEach(appendMessage);
    }

    function appendMessage(msg) {
      const div = document.createElement('div');
      div.className = 'msg';
      const name = msg.user?.username || 'unknown';
      const time = new Date(msg.createdAt).toLocaleTimeString();
      div.innerHTML = `<span class="meta">[${time}] ${name}:</span> ${escapeHtml(msg.text)}`;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    sendBtn.onclick = () => {
      const text = messageInput.value.trim();
      if (!text || !userId) return;
      socket.emit('send_message', { userId, text });
      messageInput.value = '';
    };

    messageInput.onkeydown = (e) => {
      if (e.key === 'Enter') sendBtn.click();
    };
  </script>
</body>
</html>
